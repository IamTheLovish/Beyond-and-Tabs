buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath 'org.parchmentmc:librarian:1.+'
    }
}



apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'org.parchmentmc.librarian.forgegradle'

version = '1.5.0-beta-4'
group = 'com.solegendary.reignofnether' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'reignofnether'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // Channel:   Version:
    // snapshot   YYYYMMDD   Snapshot are built nightly.
    // stable     #          Stables are built at the discretion of the MCP team.
    // official   MCVersion  Official field/method names from Mojang mapping files
    //
    // You must be aware of the Mojang license when using the 'official' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')
            arg "-mixin.config=reignofnether.mixins.json"

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Alex's Mobs / Citadel ship mixins with SRG refmaps; remap them to our dev mappings or they fail to apply
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                reignofnether {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Alex's Mobs / Citadel ship mixins with SRG refmaps; remap them to our dev mappings or they fail to apply
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                reignofnether {
                    source sourceSets.main
                }
            }
        }

        // headless smoke tests (gametest/SkirmishGameTests): `./gradlew runGameTestServer` - CI runs this on every push
        gameTestServer {
            workingDirectory project.file('run-gametest')
            // ~200 tests incl. every-unit spawn and reload sweeps on force-loaded pads: the default heap (1/4 of the
            // runner's RAM) ran out while saving chunks at shutdown (OutOfMemoryError, Oct 11)
            jvmArgs '-Xmx6G'
            property 'forge.logging.console.level', 'info'

            // Alex's Mobs / Citadel ship mixins with SRG refmaps; remap them to our dev mappings or they fail to apply
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', 'reignofnether'
            mods {
                reignofnether {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Alex's Mobs / Citadel ship mixins with SRG refmaps; remap them to our dev mappings or they fail to apply
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'reignofnether', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                reignofnether {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// The build id players see when versions do not match: 2026.10.23-0443-911d903 (UTC commit time + short sha).
// The jar version above never changes, so Forge could not tell two test builds apart. CI may set BAT_BUILD_ID;
// otherwise it comes from git, and a checkout without git is "dev". Written to bat_build_id.txt in the jar and
// read by BuildId at run time.
def batBuildId = {
    def fromEnv = System.getenv('BAT_BUILD_ID')
    if (fromEnv) return fromEnv.trim()
    try {
        def p = ['git', 'log', '-1', '--format=%cd-%h', '--date=format-local:%Y.%m.%d-%H%M'].execute(['TZ=UTC'], projectDir)
        def out = p.text.trim()
        p.waitFor()
        return (p.exitValue() == 0 && out) ? out : 'dev'
    } catch (Exception ignored) {
        return 'dev'
    }
}
def generatedBuildIdDir = layout.buildDirectory.dir('generated/batbuildid')
tasks.register('generateBuildId') {
    def outDir = generatedBuildIdDir
    outputs.dir(outDir)
    outputs.upToDateWhen { false }
    doLast {
        def f = outDir.get().file('bat_build_id.txt').asFile
        f.parentFile.mkdirs()
        f.text = batBuildId()
    }
}
sourceSets.main.resources { srcDir generatedBuildIdDir }
processResources.dependsOn 'generateBuildId'

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Alex's Mobs + Citadel (lovish approved the code dependency on Oct 10) and the building-block mods (Oct 20);
    // resolved from Modrinth's maven by version id
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

test {
    useJUnitPlatform()
    // CI's `bar` job runs this inside `./gradlew build`. Print one line with the count (plan 008: a green build must
    // show that the JUnit suite really ran and how long it took) and the full reason of any failure.
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
    afterSuite { desc, result ->
        if (!desc.parent)
            println "JUnit: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, " +
                "${result.skippedTestCount} skipped in ${(result.endTime - result.startTime) / 1000.0} s"
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:20.1.0'
    implementation 'org.junit.jupiter:junit-jupiter:5.9.2'

    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Alex's Mobs 1.22.9 (GPL-3, sbom_xela) and its library Citadel 2.6.3 (LGPL-3) for Forge 1.20.1 - the exact
    // versions in lovish's instance. Plain implementation: on the compile + run classpath (runClient/runGameTestServer
    // load them) but NOT bundled - no jarJar/shading, players install both mods themselves (mods.toml requires them).
    // Version ids are Modrinth's: alexs-mobs XoIASRVU = alexsmobs-1.22.9.jar, citadel lTAAe4sZ = citadel-2.6.3-1.20.1.jar
    implementation fg.deobf('maven.modrinth:alexs-mobs:XoIASRVU')
    implementation fg.deobf('maven.modrinth:citadel:lTAAe4sZ')

    // Building-block mods (lovish, Oct 20 2026: "increase block vocabulary, scale the buildings bigger"): faction
    // structures may use their blocks, so they are REQUIRED dependencies (mods.toml) and on the run classpath here -
    // runtimeOnly: our code never touches their classes, structures name their blocks by id ("mcwroofs:..."). The
    // GameTest server and runClient load them, so the pocket / blueprint tests check the building players see (a
    // missing mod block loads as AIR). Never bundled and NEVER copy their textures/models into this repo: Macaw's
    // Roofs + Windows and Chipped's art are All Rights Reserved. Pinned to the files in lovish's instance
    // (pack/instance_mods.json); tools/check_dep_pins.py checks these ids against those files in CI.
    // Modrinth version ids: Roofs 2.3.2, Windows 2.4.2, Fences and Walls 1.2.1, Chipped 3.0.7 with its libraries
    // Athena 3.1.2 and Resourceful Lib 2.1.29 (Forge 1.20.1).
    runtimeOnly fg.deobf('maven.modrinth:macaws-roofs:31e80GhE')
    runtimeOnly fg.deobf('maven.modrinth:macaws-windows:SSIlzrPf')
    runtimeOnly fg.deobf('maven.modrinth:macaws-fences-and-walls:HnyfcyJ9')
    runtimeOnly fg.deobf('maven.modrinth:chipped:pi3f4er3')
    runtimeOnly fg.deobf('maven.modrinth:athena-ctm:DULOQFj7')
    runtimeOnly fg.deobf('maven.modrinth:resourceful-lib:OhsHaCcW')
    // More building-block mods (lovish, Oct 28 17:00: "download any mod pack to help with buildings"), same rules:
    // required (mods.toml), never bundled, assets never copied. Doors 1.1.5 (MIT: gates and doors that open - his
    // animated lab gate idea), Bridges 3.1.2, Stairs 1.0.2 (balconies, railings), Lights and Lamps 1.1.5, Paths and
    // Pavings 1.1.1 (MIT), Decorative Blocks 4.1.3 (MIT: beams, supports, chains, braziers). Forge 1.20.1.
    runtimeOnly fg.deobf('maven.modrinth:macaws-doors:n8BlIUm3')
    runtimeOnly fg.deobf('maven.modrinth:macaws-bridges:KImk0Oo1')
    runtimeOnly fg.deobf('maven.modrinth:macaws-stairs:wL67k7Aj')
    runtimeOnly fg.deobf('maven.modrinth:macaws-lights-and-lamps:H1a9Tx4h')
    runtimeOnly fg.deobf('maven.modrinth:macaws-paths-and-pavings:yHkcTSFb')
    runtimeOnly fg.deobf('maven.modrinth:decorative-blocks:nGmyeiug')
}

mixin {
    add sourceSets.main, "reignofnether.refmap.json"
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            // Declared below due to Essential Partner Mod
            "MixinConfigs": "reignofnether.mixins.json",
            "Specification-Title": "reignofnether",
            "Specification-Vendor": "examplemodsareus",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"examplemodsareus",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ["-Xmaxerrs", "500000"]
}
