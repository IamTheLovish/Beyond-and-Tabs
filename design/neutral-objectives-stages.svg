<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="sans-serif" font-size="13">
  <rect width="720" height="260" fill="#f4efe4"/>
  <!-- stage 1: neutral, pieces float -->
  <g transform="translate(40,0)">
    <rect x="40" y="170" width="120" height="40" fill="#8a8170" stroke="#3b362d"/>
    <rect x="50" y="110" width="22" height="18" fill="#a59c89" stroke="#3b362d" transform="rotate(-12 61 119)"/>
    <rect x="88" y="90" width="26" height="20" fill="#a59c89" stroke="#3b362d" transform="rotate(9 101 100)"/>
    <rect x="126" y="118" width="22" height="18" fill="#a59c89" stroke="#3b362d" transform="rotate(-6 137 127)"/>
    <text x="100" y="240" text-anchor="middle">1. Neutral: top pieces float</text>
  </g>
  <!-- stage 2: being taken -->
  <g transform="translate(270,0)">
    <rect x="40" y="170" width="120" height="40" fill="#8a8170" stroke="#3b362d"/>
    <rect x="50" y="142" width="22" height="18" fill="#a59c89" stroke="#3b362d" transform="rotate(-4 61 151)"/>
    <rect x="88" y="132" width="26" height="20" fill="#a59c89" stroke="#3b362d"/>
    <rect x="126" y="146" width="22" height="18" fill="#a59c89" stroke="#3b362d"/>
    <rect x="98" y="60" width="6" height="72" fill="#3a6fd8" opacity="0.6"/>
    <rect x="40" y="218" width="70" height="6" fill="#3a6fd8"/><rect x="110" y="218" width="50" height="6" fill="#cfc6b3"/>
    <text x="100" y="240" text-anchor="middle">2. Being taken: pieces settle, thin beam</text>
  </g>
  <!-- stage 3: held -->
  <g transform="translate(500,0)">
    <rect x="40" y="170" width="120" height="40" fill="#8a8170" stroke="#3b362d"/>
    <rect x="50" y="152" width="22" height="18" fill="#a59c89" stroke="#3b362d"/>
    <rect x="88" y="150" width="26" height="20" fill="#a59c89" stroke="#3b362d"/>
    <rect x="126" y="152" width="22" height="18" fill="#a59c89" stroke="#3b362d"/>
    <rect x="96" y="10" width="10" height="140" fill="#3a6fd8" opacity="0.8"/>
    <text x="100" y="240" text-anchor="middle">3. Held: whole, full beam in holder colour</text>
  </g>
</svg>
