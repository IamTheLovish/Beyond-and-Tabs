# Beyond and Tabs shader pack - GPL v2 or later (see LICENSE). Original work, written clean-room; not derived from any
# other shader pack. design/own_shader_pack.md in the game's repository has the plan.

# our own lighting replaces vanilla's: no baked face shading, and the vertex AO handed over in the colour's alpha
oldLighting=false
separateAo=true
# the grade has its own vignette
vignette=false
sun=true
moon=true

# what casts sun shadows: blocks, entities and block entities; translucent blocks (water, glass) do not
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true

# slice 3's ambient occlusion runs at half resolution (lib/ao.glsl): its two passes draw into the bottom-left quarter
# of their buffers (the passes find their pixel from gl_FragCoord, so a loader that ignores this still works)
scale.deferred=0.5
scale.deferred1=0.5

# the profiles (lovish, Nov 5: "Yes, shader on, MEDIUM default (Recommended)"): MEDIUM is the pack's own defaults,
# what every new player starts on; LOW drops the per-pixel extras for weaker GPUs; HIGH sharpens and widens the shadows.
# K turns the whole pack off (vanilla's look), O opens this screen (lang: profile.comment says so in game)
# every toggle and slider of the screen is set by every profile (a profile that leaves one out keeps what the
# player had - tools/test_pack_shader_default.py); LOW also drops #437's wind, cloud shadows and RTS sharpening and
# the material maps; GRADE and EDGE_AA are the look itself and cheap, on everywhere
profile.LOW=shadowMapResolution:1024 shadowDistance:96.0 SOFT_SHADOWS:0 AO:0 BLOOM:0 CAUSTICS:0 SSR:0 MATERIALS:0 WIND:0 CLOUD_SHADOWS:0 LEAF_LIGHT:1 TEXTURE_SHARPNESS:0.0 GRADE:1 EDGE_AA:1 WATER_REALISM:1 HAZE_STRENGTH:1.0 AO_STRENGTH:1.0 WATER_WAVES:1.0 WIND_STRENGTH:1.0
profile.MEDIUM=shadowMapResolution:2048 shadowDistance:160.0 SOFT_SHADOWS:1 AO:1 BLOOM:1 CAUSTICS:1 SSR:1 MATERIALS:1 WIND:1 CLOUD_SHADOWS:1 LEAF_LIGHT:1 TEXTURE_SHARPNESS:0.5 GRADE:1 EDGE_AA:1 WATER_REALISM:1 HAZE_STRENGTH:1.0 AO_STRENGTH:1.0 WATER_WAVES:1.0 WIND_STRENGTH:1.0
profile.HIGH=shadowMapResolution:4096 shadowDistance:224.0 SOFT_SHADOWS:1 AO:1 BLOOM:1 CAUSTICS:1 SSR:1 MATERIALS:1 WIND:1 CLOUD_SHADOWS:1 LEAF_LIGHT:1 TEXTURE_SHARPNESS:0.5 GRADE:1 EDGE_AA:1 WATER_REALISM:1 HAZE_STRENGTH:1.0 AO_STRENGTH:1.0 WATER_WAVES:1.0 WIND_STRENGTH:1.0

screen=<profile> shadowMapResolution shadowDistance sunPathRotation HAZE_STRENGTH GRADE EDGE_AA MATERIALS AO AO_STRENGTH SOFT_SHADOWS BLOOM WATER_REALISM WATER_WAVES CAUSTICS SSR WIND WIND_STRENGTH CLOUD_SHADOWS LEAF_LIGHT TEXTURE_SHARPNESS
sliders=shadowMapResolution shadowDistance sunPathRotation HAZE_STRENGTH AO_STRENGTH WATER_WAVES WIND_STRENGTH TEXTURE_SHARPNESS
