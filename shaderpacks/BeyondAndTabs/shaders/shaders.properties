# Beyond and Tabs shader pack - GPL v2 or later (see LICENSE). Original work, written clean-room; not derived from any
# other shader pack. design/own_shader_pack.md in the game's repository has the plan.

# our own lighting replaces vanilla's: no baked face shading, and the vertex AO handed over in the colour's alpha
oldLighting=false
separateAo=true
# the grade has its own vignette
vignette=false
sun=true
moon=true

# what casts sun shadows: blocks, entities and block entities; translucent blocks (water, glass) do not
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true

# slice 3's ambient occlusion runs at half resolution (lib/ao.glsl): its two passes draw into the bottom-left quarter
# of their buffers (the passes find their pixel from gl_FragCoord, so a loader that ignores this still works)
scale.deferred=0.5
scale.deferred1=0.5

screen=shadowMapResolution shadowDistance sunPathRotation HAZE_STRENGTH GRADE EDGE_AA MATERIALS AO AO_STRENGTH
sliders=shadowMapResolution shadowDistance sunPathRotation HAZE_STRENGTH AO_STRENGTH
