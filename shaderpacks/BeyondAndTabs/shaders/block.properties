# Block ids the programs read (mc_Entity.x; lib/settings.glsl names them).

# grass, flowers, crops and other crossed-plane plants: lit as the ground they stand on, no sun shadow (from the RTS
# camera their hard shadows read as dark stars under every tuft), and they sway in the wind from the foot up. The
# two-block plants are split by half, so the upper half carries on the lower half's bend instead of starting at zero
block.10001=grass fern dead_bush seagrass \
 dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower \
 lily_of_the_valley wither_rose torchflower pink_petals \
 minecraft:tall_grass:half=lower minecraft:large_fern:half=lower minecraft:tall_seagrass:half=lower \
 minecraft:sunflower:half=lower minecraft:lilac:half=lower minecraft:rose_bush:half=lower minecraft:peony:half=lower \
 minecraft:pitcher_plant:half=lower \
 wheat carrots potatoes beetroots sweet_berry_bush sugar_cane \
 oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling \
 brown_mushroom red_mushroom crimson_roots warped_roots nether_sprouts

# leaves: lit and shadowed like any block, with a small shimmer in the wind (the shadow pass moves them the same way).
# The mod's decayable wart blocks are leaves to the game but solid wart to the eye: they stay still
block.10002=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves \
 cherry_leaves azalea_leaves flowering_azalea_leaves

# the upper halves of the two-block plants above (treated as 10001 otherwise)
block.10003=minecraft:tall_grass:half=upper minecraft:large_fern:half=upper minecraft:tall_seagrass:half=upper \
 minecraft:sunflower:half=upper minecraft:lilac:half=upper minecraft:rose_bush:half=upper minecraft:peony:half=upper \
 minecraft:pitcher_plant:half=upper
