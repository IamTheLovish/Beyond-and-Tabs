# "Web eyes": the dev sandbox can't open most websites, so this runner takes screenshots of reference pages
# (BAR screenshots, art references, docs) with headless Chromium and publishes them to the `web-eyes` branch, where the
# developer AI can look at them. Read-only browsing: nothing is clicked, submitted or downloaded besides the pages.
name: web-eyes
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to screenshot (full page, 1600 px wide)
        required: true
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Screenshot the pages
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          set -euo pipefail
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p out
          python - <<'EOF'
          import os, re
          from playwright.sync_api import sync_playwright
          urls = [u for u in os.environ['URLS'].split() if u.startswith(('https://', 'http://'))][:12]
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(viewport={'width': 1600, 'height': 1000}, java_script_enabled=True)
              for i, u in enumerate(urls, 1):
                  name = f"{i:02d}_" + re.sub(r'[^A-Za-z0-9]+', '_', u.split('://', 1)[1])[:60] + ".png"
                  try:
                      pg = ctx.new_page()
                      pg.goto(u, timeout=45000, wait_until='networkidle')
                      pg.screenshot(path=os.path.join('out', name), full_page=True)
                      pg.close()
                      print('ok', u)
                  except Exception as e:
                      print('failed', u, e)
              b.close()
          EOF
          ls -l out
      - name: Publish to the web-eyes branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b web-eyes
          git config user.name "eyes-bot"
          git config user.email "eyes-bot@users.noreply.github.com"
          echo "Web screenshots taken $(date -u +%FT%TZ)" > README.md
          git add -A
          git commit -q -m "Web eyes: $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-eyes
