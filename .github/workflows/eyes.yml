# "Eyes": runs the REAL game client on a CI runner (Xvfb + Mesa software rendering, HeadlessMC via the MIT-licensed
# headlesshq/mc-runtime-test action), lets matchstart/EyesDirector play a scripted tour (-Dbat.eyes=true) and publishes
# the screenshots to the `eyes` branch, so the developer AI can see what a player sees. Since Oct 13 the display is also
# recorded (tools/eyes_record.sh, ffmpeg x11grab) and cut into a ten-second clip per still (tools/eyes_cut.py), so motion -
# camera glides, animation, fights - can be studied frame by frame like a playtest clip. Nothing here touches anyone's PC.
name: eyes
on:
  workflow_dispatch:
    inputs:
      shaders:
        description: "Shader look test: Oculus + Complementary Reimagined + Vanilla Normals Renewed, official downloads at run time (publishes to branch eyes-shaders)"
        type: boolean
        default: false
      pack:
        description: "Block textures: ours (resourcepacks/BeyondAndTabs-Realistic) or none (vanilla / VNR only - the A/B that tells our pack from the shader or the camera; publishes to <lane>-nopack)"
        type: choice
        options: [ours, none]
        default: ours
      build_run:
        description: "Optional: a build run id whose jar (artifact bar-mod) this tour tests - for a dispatch while main's bar/ has moved past bar-dev (two sessions pushing)"
        required: false
        default: ''
      look:
        description: "World look setting for the tour (the client config's world_look): default (the mod's own, Subtle), off, subtle, full - 02 is shot with it, 02b with the look forced off"
        type: choice
        options: ["default", "off", "subtle", "full"]   # quoted: YAML reads a bare off as false
        default: default
      rp:
        description: "Shader lane: Complementary's RP Support - labpbr (reads our _n / _s maps: normals, smoothness, metals, SSS, emission) or integrated (its own generated PBR, the pack's default)"
        type: choice
        options: [labpbr, integrated]
        default: labpbr
      shader_pack:
        description: "Shader lane: complementary (Complementary Reimagined - the pick for lovish's PC) or bliss (Bliss, an edit of Chocapic13's; his Oct 15 reference clip) - official Modrinth file at run time; bliss publishes to eyes-shaders-bliss"
        type: choice
        options: [complementary, bliss]
        default: complementary
      shader_options:
        description: "Shader lane: extra options for the pack's options file, KEY=VALUE separated by ';' (e.g. BorderFog=false;TOGGLE_VL_FOG=false) - an A/B of the pack's own settings; publishes to <lane>-custom"
        required: false
        default: ''
  workflow_run:
    workflows: [build]
    branches: [main]
    types: [completed]
permissions:
  contents: write
  actions: read     # to download the triggering build's own jar
jobs:
  eyes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # one tour per lane at a time (each lane force-pushes its own branch); lanes run side by side. JOB-level, not
    # workflow-level: a newer PENDING run cancels an older pending one in the same group, and at workflow level the
    # skipped runs of cancelled tools-only builds took part - one could replace a real build's queued tour (Oct 15,
    # two sessions pushing at once). A skipped job never enters the group.
    concurrency:
      group: eyes-${{ inputs.shaders && 'shaders' || 'plain' }}-${{ inputs.shader_pack || 'complementary' }}-${{ inputs.pack || 'ours' }}-${{ inputs.look || 'default' }}-${{ inputs.shader_options && 'custom' || 'std' }}
      cancel-in-progress: false   # never cancel a tour in progress
    # pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19 2026 - Xvfb, Mesa, ffmpeg and HeadlessMC are untested there
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.shaders && 75 || 45 }}
    env:
      GH_TOKEN: ${{ github.token }}
      # the commit whose build this tests (a workflow_run's GITHUB_SHA is main's head, which may already be newer)
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUILD_RUN: ${{ github.event.workflow_run.id || inputs.build_run }}
      MIN_STILLS: ${{ inputs.shaders && 8 || 30 }}
      SHADERS: ${{ inputs.shaders && '1' || '0' }}
      OUR_PACK: ${{ inputs.pack == 'none' && '0' || '1' }}
      RP: ${{ inputs.rp || 'labpbr' }}
      SHADER_PACK: ${{ inputs.shader_pack || 'complementary' }}
      SHADER_OPTIONS: ${{ inputs.shader_options || '' }}
      LOOK: ${{ inputs.look || 'default' }}
      # a non-default look publishes to its own branch (eyes-look-full, ...) so the lane's latest stills and its
      # approved baseline stay at the shipped setting
      # (and a Bliss tour its own: eyes-shaders-bliss - the Complementary lane's baseline stays Complementary's)
      EYES_BRANCH: ${{ format('{0}{1}{2}{3}', inputs.shaders && (inputs.shader_pack == 'bliss' && 'eyes-shaders-bliss' || 'eyes-shaders') || 'eyes', inputs.pack == 'none' && '-nopack' || '', (inputs.look && inputs.look != 'default') && format('-look-{0}', inputs.look) || '', (inputs.shaders && inputs.shader_options) && '-custom' || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Gather the mods (our bar-dev jar + the tester pack's dependencies, sha512-checked)
        run: |
          set -euo pipefail
          mkdir -p run/mods dl
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${BUILD_RUN:-}" ]; then
            # a dispatch pinned to a build: label the stills with that build's commit, not main's head
            BUILD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
            echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
            echo "dispatch pinned to build run $BUILD_RUN (${BUILD_SHA::7})"
          fi
          # the triggering build's own jar; failing that, bar-dev ONLY if its notes name this very commit (Oct 15:
          # run 38668033399 was labelled 695c8cd and tested 506ca6b's jar - bar-dev had moved on underneath it)
          if [ -n "${BUILD_RUN:-}" ] && gh run download "$BUILD_RUN" -n bar-mod -D dl --repo "$GITHUB_REPOSITORY"; then
            echo "jar: artifact bar-mod of build run $BUILD_RUN"
          else
            gh release download bar-dev --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir dl --clobber
            body=$(gh release view bar-dev --repo "$GITHUB_REPOSITORY" --json body -q .body)
            jar_sha=$(printf '%s' "$body" | grep -oE '[0-9a-f]{40}' | head -1 || true)
            if [ "$jar_sha" = "$BUILD_SHA" ]; then
              echo "jar: bar-dev, built from $BUILD_SHA"
            # a commit that changed nothing under bar/ (tools, docs, workflows) runs the same jar: accept bar-dev when
            # its commit and this one have the same bar/ tree (Oct 15: shader dispatch 38708903843 refused a jar whose
            # code was identical, because a docs/tools commit had landed in between)
            elif [ -n "$jar_sha" ] && git fetch -q --depth=1 origin "$jar_sha" "$BUILD_SHA" \
                && [ "$(git rev-parse "$jar_sha:bar")" = "$(git rev-parse "$BUILD_SHA:bar")" ]; then
              echo "jar: bar-dev, built from ${jar_sha::7} - bar/ is identical to ${BUILD_SHA::7}"
            else
              echo "::error::bar-dev is not the build of ${BUILD_SHA::7} and its bar/ differs ($body) - refusing to test the wrong jar"; exit 1
            fi
          fi
          cp "$(ls dl/*.jar | head -1)" run/mods/beyondandtabs.jar
          gh release download test-pack --repo "$GITHUB_REPOSITORY" --pattern 'BeyondAndTabs-test.mrpack' --dir dl --clobber
          unzip -o -q dl/BeyondAndTabs-test.mrpack modrinth.index.json -d dl
          python3 - <<'EOF'
          import json, hashlib, urllib.request, os
          idx = json.load(open('dl/modrinth.index.json'))
          for f in idx['files']:
              name = os.path.basename(f['path'])
              low = name.lower()
              # software GL: skip the renderer replacements (as the Mac pack does) and the tunnel - except Embeddium in
              # the shader lane: Oculus 1.8.0 mixes into BufferBuilder with Embeddium's MemoryIntrinsics and crashes at
              # RenderSystem init without it (dispatch 38710333378, Oct 15)
              skip = ('immediatelyfast', 'e4mc') if os.environ.get('SHADERS') == '1' else ('embeddium', 'immediatelyfast', 'e4mc')
              if any(k in low for k in skip):
                  print('skip', name); continue
              data = urllib.request.urlopen(urllib.request.Request(f['downloads'][0],
                  headers={'User-Agent': 'Beyond-and-Tabs eyes'}), timeout=120).read()
              if hashlib.sha512(data).hexdigest() != f['hashes']['sha512']:
                  raise SystemExit('sha512 mismatch for ' + name)
              open(os.path.join('run/mods', name), 'wb').write(data)
              print('ok', name)
          EOF
          ls -l run/mods
      - name: Window size (1600x900, a common laptop size; the default 854x480 crowds the HUD)
        run: |
          mkdir -p run
          printf 'overrideWidth:1600\noverrideHeight:900\n' >> run/options.txt
      - name: Shader look (dispatch only) - Oculus, Complementary Reimagined, Vanilla Normals Renewed
        # all three from their official pages at run time, never committed (Oculus LGPL-3; Complementary: normal use
        # per its licence; VNR: free with a link - github.com/Poudingue/Vanilla-Normals-Renewed). Oculus needs
        # Embeddium (it crashed at RenderSystem init without it, Oct 15): the tester pack's copy is kept in this lane,
        # or Embeddium 0.3.31 (Oculus 1.8.0's pair) is fetched here. Our units carry LabPBR _n/_s maps (tools/materials.py).
        if: env.SHADERS == '1'
        run: |
          set -euo pipefail
          mkdir -p run/shaderpacks run/resourcepacks run/config
          python3 - <<'EOF'
          import json, hashlib, urllib.request, urllib.parse
          UA = {'User-Agent': 'Beyond-and-Tabs eyes (shader test)'}
          def versions(slug, loader):
              q = urllib.parse.urlencode({'loaders': json.dumps([loader]), 'game_versions': json.dumps(['1.20.1'])})
              url = 'https://api.modrinth.com/v2/project/%s/version?%s' % (slug, q)
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60))
          def primary(v):
              return next((f for f in v['files'] if f.get('primary')), v['files'][0])
          def fetch(f, dest):
              data = urllib.request.urlopen(urllib.request.Request(f['url'], headers=UA), timeout=300).read()
              if hashlib.sha512(data).hexdigest() != f['hashes']['sha512']:
                  raise SystemExit('sha512 mismatch for ' + f['filename'])
              open(dest, 'wb').write(data)
              print('ok', f['filename'])
              got.append('%s (sha512 %s...)' % (f['filename'], f['hashes']['sha512'][:16]))
          got = []
          oc = versions('oculus', 'forge')
          oc = [v for v in oc if v['version_number'] == '1.20.1-1.8.0'] or oc
          f = primary(oc[0]); fetch(f, 'run/mods/' + f['filename'])
          import os
          if not any('embeddium' in n.lower() for n in os.listdir('run/mods')):
              em = versions('embeddium', 'forge')
              em = [v for v in em if v['version_number'].startswith('0.3.31')] or em
              f = primary(em[0]); fetch(f, 'run/mods/' + f['filename'])
          pack = os.environ.get('SHADER_PACK', 'complementary')
          cr = versions('bliss-shader' if pack == 'bliss' else 'complementary-reimagined', 'iris')
          if not cr:
              raise SystemExit('no %s version for Iris / 1.20.1 on Modrinth' % pack)
          f = primary(cr[0]); fetch(f, 'run/shaderpacks/' + f['filename'])
          for name in ('oculus.properties', 'iris.properties'):
              open('run/config/' + name, 'w').write(
                  'enableShaders=true\nshaderPack=%s\ndisableUpdateMessage=true\nmaxShadowRenderDistance=8\n' % f['filename'])
          # the pack's own options (Iris / Oculus read shaderpacks/<pack file>.txt). Complementary defaults to RP_MODE 1,
          # "Integrated PBR+" - its OWN generated normals and specular - so until Oct 15 every shader-lane tour ignored our
          # LabPBR maps (blocks and units alike). RP_MODE 3 = labPBR, what lovish's install uses (realistic-look.md).
          rp = os.environ.get('RP', 'labpbr')
          if pack == 'bliss':
              # Bliss reads a pack's LabPBR maps only with these on (all off / hardcoded by default - its
              # shaders/lib/settings.glsl): reflections from smoothness / F0, material AO, LabPBR emission and SSS
              # beside its own hardcoded ones. POM and DOF stay off (Complementary's lane runs without them too)
              opts = ('Specular_Reflections=true\nMATERIAL_AO=true\nEMISSIVE_TYPE=2\nSSS_TYPE=2\n' if rp == 'labpbr'
                      else '')
          else:
              opts = 'RP_MODE=%d\n' % (3 if rp == 'labpbr' else 1)
          extra = [kv.strip() for kv in os.environ.get('SHADER_OPTIONS', '').split(';') if kv.strip()]
          for kv in extra:
              if '=' not in kv:
                  raise SystemExit('shader_options: %r is not KEY=VALUE' % kv)
          if extra:
              opts += ''.join(kv + '\n' for kv in extra)
              print('::notice::[Eyes] extra shader options: ' + '; '.join(extra))
          open('run/shaderpacks/%s.txt' % f['filename'], 'w').write(opts)
          print(pack, 'options:', opts.replace('\n', ' ') or '(defaults)', '(%s)' % rp)
          # the exact files this tour ran, as an annotation: a green shader tour is the install list for lovish's PC
          for n in sorted(os.listdir('run/mods')):
              if 'embeddium' in n.lower() and not any(g.startswith(n) for g in got):
                  got.append('%s (sha512 %s..., from the tester pack)' % (n, hashlib.sha512(open('run/mods/' + n, 'rb').read()).hexdigest()[:16]))
          print('::notice::[Eyes] shader lane files: ' + '; '.join(got))
          EOF
          # "Never twice" guard (improvement-loop.md, Oct 15): Oculus without Embeddium crashes at RenderSystem init
          # 10 minutes into a run (38710333378) - fail in seconds instead
          if ls run/mods | grep -qi oculus && ! ls run/mods | grep -qi embeddium; then
            echo "::error::Oculus is in run/mods without Embeddium - it would crash at RenderSystem init"; exit 1
          fi
          git clone -q --depth 1 https://github.com/Poudingue/Vanilla-Normals-Renewed.git run/resourcepacks/VNR
          rm -rf run/resourcepacks/VNR/.git
          printf 'resourcePacks:["vanilla","mod_resources","file/VNR"]\n' >> run/options.txt
          ls -l run/mods run/shaderpacks run/config
      - name: World look setting (dispatch input; default leaves the mod's own default)
        if: env.LOOK != 'default'
        run: |
          set -euo pipefail
          ver=$(grep -oE 'VERSION_STRING = "[^"]+"' bar/src/main/java/com/solegendary/reignofnether/ReignOfNether.java | cut -d'"' -f2)
          case "$LOOK" in off) v=0 ;; subtle) v=1 ;; full) v=2 ;; *) echo "::error::look must be off, subtle or full"; exit 1 ;; esac
          mkdir -p run/config
          # Forge fills in every other key with its default at first launch
          printf 'world_look = %d\n' "$v" > "run/config/reignofnether-client-$ver.toml"
          echo "::notice::[Eyes] world look for this tour: $LOOK (world_look = $v, reignofnether-client-$ver.toml)"
      - name: Our realistic block pack (both lanes - tools/gen_blocks.py, original 128x + LabPBR)
        # the realistic look's world (claude/realistic-look.md): shown in every tour so the units are judged in the
        # world they will live in; above VNR in the shader lane (ours covers its block textures, VNR the rest).
        # The textures are GENERATED here (the repo ignores *.png, so the folder holds only pack.mcmeta + README): from
        # 5fc9ca5 to 87a0760 every tour loaded an EMPTY pack and nobody noticed - so the textures are counted, and a
        # pack with none fails the run (a "Never twice" guard, claude/improvement-loop.md)
        run: |
          set -euo pipefail
          if [ "$OUR_PACK" != "1" ]; then
            echo "pack: none (A/B dispatch) - vanilla textures$([ "$SHADERS" = "1" ] && echo ' + VNR')"; exit 0
          fi
          python3 -m pip install --quiet --user --break-system-packages numpy pillow >/dev/null 2>&1 || pip install --quiet numpy pillow
          python3 tools/gen_blocks.py > /dev/null
          d=resourcepacks/BeyondAndTabs-Realistic/assets/minecraft/textures/block
          colour=$(find "$d" -name '*.png' ! -name '*_n.png' ! -name '*_s.png' | wc -l)
          maps=$(find "$d" -name '*_n.png' -o -name '*_s.png' | wc -l)
          echo "::notice::[Eyes] our block pack: $colour colour textures + $maps LabPBR maps (tools/gen_blocks.py)"
          [ "$colour" -ge 10 ] || { echo "::error::our block pack has $colour textures - the tour would show vanilla"; exit 1; }
          mkdir -p run/resourcepacks
          cp -r resourcepacks/BeyondAndTabs-Realistic run/resourcepacks/
          if [ "$SHADERS" = "1" ]; then
            printf 'resourcePacks:["vanilla","mod_resources","file/VNR","file/BeyondAndTabs-Realistic"]\n' >> run/options.txt
          else
            printf 'resourcePacks:["vanilla","mod_resources","file/BeyondAndTabs-Realistic"]\n' >> run/options.txt
          fi
          grep resourcePacks run/options.txt
      - name: Start the recorder (waits for the tour's Xvfb display, then films it)
        run: |
          which ffmpeg || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          which xdotool || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xdotool
          setsid nohup bash tools/eyes_record.sh "$PWD/eyes-rec" > /dev/null 2>&1 &
          echo "recorder pid $!"
          # memory and load every 30 s (published as mem.log): three tours lost their runner on Oct 15 ("lost
          # communication") with no log left - this shows whether memory or CPU ran out
          setsid nohup bash -c 'while sleep 30; do echo "$(date -u +%H:%M:%S) $(free -m | awk "/Mem:/{print \"used \" \$3 \" MB, available \" \$7}") load $(cut -d" " -f1-3 /proc/loadavg)"; done' > "$PWD/mem.log" 2>&1 &
      - name: Play the scripted tour in the real client
        id: tour
        continue-on-error: true
        # a green tour plays ~7 min (plain) / ~12 (shaders); the runners that hung on Oct 15 died at 50-60 min, past
        # the old 60 / 30 - ending the step well before lets the publish step still save the log
        timeout-minutes: ${{ inputs.shaders && 30 || 20 }}
        uses: headlesshq/mc-runtime-test@dfc8a2a0145f723b01abda5e1cf59eaba516d128
        with:
          mc: 1.20.1
          modloader: forge
          java: 17
          mc-runtime-test: none
          dummy-assets: 'false'
          xvfb: 'true'
          headlessmc-command: '--jvm "-Djava.awt.headless=true -Dbat.eyes=true -Xmx4G"'
      - name: Stop the recorder and cut a clip per still
        continue-on-error: true
        run: |
          set -u
          pkill -INT -f "x11grab" || true
          for i in $(seq 1 30); do pgrep -f "x11grab" > /dev/null || break; sleep 1; done
          pkill -KILL -f "x11grab" || true
          cat eyes-rec/rec.log 2>/dev/null || echo "no rec.log"
          ls -l eyes-rec 2>/dev/null || true
          log=$(find . "$HOME" -path '*logs/latest.log' -not -path './eyes-rec/*' 2>/dev/null | head -1 || true)
          mkdir -p out/clips
          python3 tools/eyes_cut.py eyes-rec "${log:-/nonexistent}" out/clips
          cp eyes-rec/rec.log out/clips/rec.log 2>/dev/null || true
          n=$(find out/clips -name '*.mp4' | wc -l)
          echo "::notice::[Eyes] $n video clips"
      - name: Publish the screenshots to the eyes branch
        run: |
          set -euo pipefail
          mkdir -p out
          # the action may run the client outside run/, so search the whole workspace (and HOME) for our shots and log
          find . "$HOME" -name 'bat_eyes_*.png' -not -path './out/*' 2>/dev/null -exec cp {} out/ \; || true
          cp mem.log out/mem.log 2>/dev/null || true
          [ -f out/mem.log ] && echo "::notice::[Eyes] memory: peak used $(awk '{print $3}' out/mem.log | sort -n | tail -1) MB, lowest available $(awk '{print $6}' out/mem.log | sort -n | head -1) MB, highest load $(awk '{print $8}' out/mem.log | sort -n | tail -1)"
          log=$(find . "$HOME" -path '*logs/latest.log' 2>/dev/null | head -1 || true)
          echo "client log: ${log:-none}"
          if [ -n "$log" ]; then
            # the whole log, and every warning and error in it (head -80 used to cut the list before the last scenes,
            # and WARN - where missing textures and models are reported - was never collected)
            cp "$log" out/latest.log || true
            tail -n 200 "$log" > out/latest-log-tail.txt || true
            grep -E "\[Eyes\]|Exception|ERROR" "$log" | head -2000 > out/eyes-lines.txt || true
            # first-launch config noise ("Incorrect key X was corrected from null to its default" - 1973 of the 2000
            # lines on run 38697962581, so the cap cut the file at the title screen and the tour's warnings were never
            # seen): counted in one line, then left out
            noise="Incorrect key .* was corrected|is not correct\. Correcting|is missing mods\.toml file|should be final|uses unexpected schema|awning_bounce"
            echo "($(grep -cE "$noise" "$log" || true) first-launch config/mod-loading notices filtered out)" > out/warnings.txt
            grep -E "WARN|ERROR|Exception|Missing|Unable to|Couldn't|Failed to" "$log" \
              | grep -vE "OpenAL|Realms|profile key|401|Error loading class|planter_rich|Narrator" \
              | grep -vE "$noise" | head -2000 >> out/warnings.txt || true
            echo "::notice::[Eyes] $(( $(wc -l < out/warnings.txt) - 1 )) warning/error lines (out/warnings.txt on the eyes branch)"
            grep -iE "reignofnether|beyondandtabs|missing texture|missing model|Unable to load model" out/warnings.txt \
              | head -10 | sed 's/^/::warning::/' || true
            grep -q "\[Eyes\] tour complete" "$log" && echo "TOUR_COMPLETE=1" >> "$GITHUB_ENV" || true
            # which packs loaded, and the size our grass reached the block atlas at (128 = ours, 16 = vanilla)
            packs=$(grep -m1 -oE "\[Eyes\] resource packs .*" "$log" || true)
            [ -n "$packs" ] && echo "::notice::$packs"
            if [ "$OUR_PACK" = "1" ] && [ -n "$packs" ] && ! echo "$packs" | grep -q "grass_block_top is 128x128"; then
              echo "::warning::our block pack is on but grass_block_top is not 128x128 in the atlas - the tour shows vanilla grass"
            fi
            # the close-up framing guard (EyesDirector.checkFraming): a close-up that is small, off the frame or under
            # the HUD is named on the run page, not found later by a human
            grep -oE "\[Eyes\] [^ ]+ framing: .*\(framing check\)" "$log" | head -10 | sed 's/^/::warning::/' || true
          fi
          ls -l out
          n=$(find out -name '*.png' | wc -l)
          echo "STILLS=$n" >> "$GITHUB_ENV"
          echo "::notice::[Eyes] $n screenshots (client log: ${log:-none})"
          # annotations are readable even when run logs are not
          { grep -h "Eyes\|Exception" out/eyes-lines.txt 2>/dev/null || true; } | head -8 | sed 's/^/::notice::/' || true
          # R6 picture regression (tools/eyes_diff.py): this run's stills vs the last APPROVED set (branch
          # <lane>-approved, set by eyes-approve.yml) -> out/eyes-diff.md + eyes-diff.jpg. Reports, never fails the run.
          if git fetch -q --depth=1 origin "$EYES_BRANCH-approved" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/approved"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/approved" --wildcards 'bat_eyes_*.png' 2>/dev/null || true
            python3 -m pip install --quiet --user --break-system-packages numpy pillow >/dev/null 2>&1 || true
            if python3 tools/eyes_diff.py "$RUNNER_TEMP/approved" out out; then
              echo "::notice::[Eyes] $(grep -m1 '^- compared' out/eyes-diff.md | sed 's/^- //') (out/eyes-diff.md)"
            fi
          else
            echo "no $EYES_BRANCH-approved branch yet - picture regression skipped (approve a run with eyes-approve.yml)"
          fi
          cd out
          git init -q -b "$EYES_BRANCH"
          git config user.name "eyes-bot"
          git config user.email "eyes-bot@users.noreply.github.com"
          echo "Screenshots from build ${BUILD_SHA::7} at $(date -u +%FT%TZ)" > README.md
          git add -A
          git commit -q -m "Eyes: screenshots for ${BUILD_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$EYES_BRANCH"
      - name: Fail loudly if the tour did not finish (a green run must mean the game was seen)
        run: |
          echo "tour step: ${{ steps.tour.outcome }}, stills: ${STILLS:-0} (min $MIN_STILLS), tour complete: ${TOUR_COMPLETE:-0}"
          [ "${{ steps.tour.outcome }}" = "success" ] || { echo "::error::the client step failed or timed out"; exit 1; }
          [ "${TOUR_COMPLETE:-0}" = "1" ] || { echo "::error::no '[Eyes] tour complete' in the client log"; exit 1; }
          [ "${STILLS:-0}" -ge "$MIN_STILLS" ] || { echo "::error::only ${STILLS:-0} stills (expected >= $MIN_STILLS)"; exit 1; }
