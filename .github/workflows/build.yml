name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
env:
  # the test batches of shard 2 (job bar-tests); job bar runs every other batch, so a new batch lands in shard 1.
  # Chosen from build ed041bf's [GameTest timing] notice (Oct 15): defaultBatch:4 10m43s, duel_matrix 5m02s,
  # defaultBatch:1 3m36s, duel_counters 3m18s, defaultBatch:2 2m09s, defaultBatch:3 1m42s, texture_mips 1m15s, the
  # rest ~1 min together. Re-balance from the notice of each shard; names: gametest/GameTestShards.
  HEAVY_BATCHES: "defaultBatch:4,duel_counters"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Design sheets preflight (unverified cells allowed for dev builds)
        run: python3 tools/preflight.py --allow-unverified
      - name: Generated code matches the sheets
        run: python3 tools/gen_java.py && git diff --exit-code engine/src/main/java/dev/beyondtabs/engine/gen
      - name: Safety protocol - structural syntax gate and balance audit
        run: |
          python3 tools/check_java.py $(git ls-files 'bar/src/main/java/*.java' 'mod/src/main/java/*.java' 'engine/src/*.java')
          python3 tools/balance_audit.py
          python3 tools/check_building_icons.py
          python3 tools/check_sail_hubs.py
          python3 tools/hud_layout.py
      - name: Engine benches (no Minecraft)
        run: |
          mkdir -p /tmp/bt && javac --release 17 -d /tmp/bt $(find engine/src -name "*.java")
          java -cp /tmp/bt dev.beyondtabs.engine.Bench
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8' }
      - name: Build the Forge mod
        run: |
          set -o pipefail
          gradle -p mod build --stacktrace 2>&1 | tee build.log || {
            # surface compiler errors as annotations (readable through the GitHub API)
            grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^.*/(mod|engine)/(src/[^:]+):([0-9]+): error: (.*)$#\1/\2#')
              l=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): error: .*$#\1#')
              m=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
              echo "::error file=$f,line=$l::$m"
            done
            grep -E "^\s+(symbol|location):" build.log | head -40 | sed 's/^/::warning::/'
            grep -E "FAILURE|What went wrong|> " build.log | head -20 | sed 's/^/::warning::/'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beyondandtabs-mod
          path: mod/build/libs/*.jar
      - name: Remove the previous dev build and older run artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
      - name: Publish the latest dev build (pre-release 'dev')
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest dev build
          prerelease: true
          make_latest: false
          body: "Automatic build of the newest commit on main (${{ github.sha }}). Untested in-game unless noted in the commit."
          files: mod/build/libs/*.jar

  # Beyond and Tabs on the Reign of Nether base (bar/): built with its own Gradle wrapper (ForgeGradle 5, Gradle 7.6)
  bar:
    needs: build   # publish after the main job so the two releases are never updated at the same moment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the whole history, for the dev-time count below
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Count the development time (title screen, hud/DevTime)
        run: |
          # commits under 30 min apart count their real gap; each session gets 15 min before its first commit
          # (claude/dev-time-counter.md). Baked into the jar; nothing is computed at runtime.
          git log --format=%ct | sort -n | python3 -c "
          import sys, json
          t = [int(x) for x in sys.stdin if x.strip()]
          s = sum(b - a if b - a <= 1800 else 900 for a, b in zip(t, t[1:])) + 900 if t else 0
          json.dump({'hours': round(s / 3600, 1), 'commits': len(t), 'since': t[0] if t else 0},
                    open('bar/src/main/resources/assets/reignofnether/devtime.json', 'w'))
          print('dev time:', round(s / 3600, 1), 'h over', len(t), 'commits')
          "
          echo "::notice::[DevTime] $(cat bar/src/main/resources/assets/reignofnether/devtime.json)"
      - name: Build the BAR-on-RoN mod
        working-directory: bar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log || {
            grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^.*/bar/(src/[^:]+):([0-9]+): error: (.*)$#bar/\1#')
              l=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): error: .*$#\1#')
              m=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
              echo "::error file=$f,line=$l::$m"
            done
            grep -E "^\s+(symbol|location):" build.log | head -40 | sed 's/^/::warning::/'
            grep -E "FAILURE|What went wrong|> " build.log | head -20 | sed 's/^/::warning::/'
            exit 1
          }
      - name: Keep this run's own jar (the eyes run tests exactly this build, not whatever bar-dev holds by then)
        uses: actions/upload-artifact@v4
        with:
          name: bar-mod
          path: bar/build/libs/*.jar
          retention-days: 3
      - name: Headless smoke tests on a real server, shard 1 of 2 (every batch except HEAVY_BATCHES)
        working-directory: bar
        env: { BAT_GAMETEST_SKIP: "${{ env.HEAVY_BATCHES }}" }
        run: bash ../tools/ci_gametests.sh
      # the duel simulator (gametest/DuelGameTests) is a balance measurement: its results become a handful of notices
      # (readable through the GitHub API), and this step never fails the build - only the test itself can, on a duel
      # that could not run
      - name: Duel simulator results (measurement only)
        if: always()
        run: python3 tools/duel_summary.py bar/run-gametest/duel_results.json || true

  # shard 2 of 2 of the headless tests, side by side with bar's shard 1 (gametest/GameTestShards): the suite ran its
  # batches one after another for ~29 of a build's ~35 minutes (Oct 15, the [GameTest timing] notice); split by whole
  # batches, each half takes about half. Same checkout, dev-time count and script as bar; no jar is kept from here.
  bar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the whole history, for the dev-time count (the DevTime tests read it)
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Count the development time (same as bar's)
        run: |
          git log --format=%ct | sort -n | python3 -c "
          import sys, json
          t = [int(x) for x in sys.stdin if x.strip()]
          s = sum(b - a if b - a <= 1800 else 900 for a, b in zip(t, t[1:])) + 900 if t else 0
          json.dump({'hours': round(s / 3600, 1), 'commits': len(t), 'since': t[0] if t else 0},
                    open('bar/src/main/resources/assets/reignofnether/devtime.json', 'w'))
          "
      - name: Headless smoke tests on a real server, shard 2 of 2 (HEAVY_BATCHES)
        working-directory: bar
        env: { BAT_GAMETEST_ONLY: "${{ env.HEAVY_BATCHES }}" }
        run: |
          chmod +x gradlew
          bash ../tools/ci_gametests.sh
      - name: Duel simulator results (measurement only)
        if: always()
        run: python3 tools/duel_summary.py bar/run-gametest/duel_results.json || true

  # publishes bar-dev only when BOTH test shards passed (bar's jar, kept as the run's artifact bar-mod)
  bar-publish:
    needs: [bar, bar-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bar-mod, path: bar/build/libs }
      - name: Our realistic block pack as a zip (tools/gen_blocks.py - the textures are generated, not stored in git)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user --break-system-packages numpy pillow >/dev/null 2>&1 || pip install --quiet numpy pillow
          python3 tools/gen_blocks.py > /dev/null
          mkdir -p dist
          (cd resourcepacks/BeyondAndTabs-Realistic && zip -q -r -X ../../dist/BeyondAndTabs-Realistic.zip pack.mcmeta README.md assets)
          n=$(unzip -l dist/BeyondAndTabs-Realistic.zip | grep -c '\.png$')
          echo "::notice::[Pack] BeyondAndTabs-Realistic.zip: $n textures, $(du -k dist/BeyondAndTabs-Realistic.zip | cut -f1) KB"
          [ "$n" -ge 30 ] || { echo "::error::the block pack zip has only $n textures"; exit 1; }
      - name: Remove the previous BAR build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete bar-dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
      - name: Publish the latest BAR build (pre-release 'bar-dev')
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bar-dev
          name: Latest BAR build (Reign of Nether base)
          prerelease: true
          make_latest: false
          body: "Automatic build of bar/ at ${{ github.sha }}. Untested in-game unless noted in the commit."
          files: |
            bar/build/libs/*.jar
            dist/BeyondAndTabs-Realistic.zip
