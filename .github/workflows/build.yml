name: build
on:
  # Runners (lovish Oct 21 02:16: "run multiple runners"): pull-request builds run on GitHub's own runners (free for
  # this public repo, many at once); pushes to main and manual runs stay on vars.RUNNER (the self-hosted pc-1), so
  # bar-dev is still published from the same machine. Before, every build queued on pc-1 alone.
  # push only on main: a PR branch builds once through pull_request (with one self-hosted runner, pc-1, the extra
  # push run doubled the queue - Oct 18). Other branches can still be built by hand with workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # pull requests: a newer push to a PR replaces that PR's older queued or running build.
  # main pushes share ONE group without cancel-in-progress (lovish Oct 21): at most one main build runs and ONE waits;
  # a newer merge replaces the waiting one (GitHub cancels an older *pending* run of a group), the running one is never
  # cut off - so a batch of quick merges costs two builds, not one per merge.
  # manual runs get a group of their own, so they never cancel each other.
  group: build2-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && 'main-push' || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
  actions: write
env:
  # The headless GameTests run in 8 shards side by side (gametest/GameTestShards); the public repo gets ~20 hosted
  # runners, a build uses 9 jobs (build + 8 shards) so two builds fit at once. Job `bar` is shard 1 and runs everything
  # no list names (so a new test or batch lands there); job `bar-tests` runs one matrix entry per SHARD_n below, n >= 2.
  # ADDING A SHARD = ONE NEW LINE `SHARD_9: "..."` (the `changes` job builds the matrix from these lines, shard 1 skips
  # them all). No test may be named by two lists (tools/check_shards.py checks, bar-audit proves every test ran once).
  # An entry names a whole batch ("duel_matrix") or tests by prefix of the test's name ("test:bots_pl"): the lower-cased
  # METHOD name, no class (the [TestTime] lines show it). Shards 6-8 are generated lists: the shortest prefixes that match
  # nothing outside their slice, so no batch such as match_lifecycle is split and no list overlaps another
  # (tools/check_shards.py proves it). Shard 1 keeps everything no list names: the small batches, an alphabetical
  # slice of the quick tests, and every new test.
  # Measured (PR #101 runs, Oct 21): about 40 tests take ~90-100 s each, the rest under 30 s, and they cluster: a batch
  # lasts as long as its slowest test, so a shard pays a slow cluster ONCE - shard 7 holds the slow tests of vanilla's
  # chunk 2 (hero_*, wide_units, melee_chase ...) and of chunk 5 (tidewrought_*, verdant_* ...), shard 6 the bots soak
  # alone (170-300 s of game ticks, and it slows every test that shares its server), the rest is quick. A test's
  # arena sits beside its batch neighbours', so a new mix can put another test's units within reach of one that
  # assumes empty ground (striker_autocasts_on_an_enemy_in_range_and_not_out_of_range failed deterministically beside
  # the wrong neighbour in one shard mix; alone in a batch in shard 6 it has none) - a red test that passed in an
  # earlier cut is a neighbour problem: move it, do not retry. Production is far-chunk generation bound (264 s for the worst of 4 sharing a server): three,
  # three and two tests per shard (2, 3, 8). Each duel simulator is one test of 3 min on its own server (4, 5).
  # Re-balance from each shard's [GameTest timing] and [Test times] notices (every test's wall time, slowest first).
  # Why 8 shards: each pays ~4.5 min before its first test (checkout with history, gradle, server start) and the
  # longest single test is ~3.3 min (duel_counters), so no split finishes a build under ~8 min; 8 shards keep every
  # shard's tests at or under that floor, and 9 jobs per build let two builds run at once in the ~20 hosted runners.
  SHARD_2: "test:production_buildings_place_every_unit_6,test:production_buildings_place_every_unit_3,test:production_buildings_place_every_unit_1"
  SHARD_3: "test:production_buildings_place_every_unit_0,test:production_buildings_place_every_unit_5,test:production_buildings_place_every_unit_7"
  SHARD_4: "duel_matrix"
  SHARD_5: "duel_counters"
  SHARD_6: "test:bots_pl,test:striker_autocasts_on_an_enemy_in_range"
  SHARD_7: "test:des,test:ear,test:enhanced_t,test:every_building_b,test:every_building_h,test:every_c,test:exp,test:faction_aura_s,test:fire,test:game_ender_c,test:hero_gains_x,test:hero_ge,test:hero_ra,test:heroe,test:holy_bell_reveals_f,test:melee_c,test:stac,test:statu,test:stea,test:storm_,test:structures_have_no_unit_pockets_0,test:structures_have_no_unit_pockets_1,test:structures_have_no_unit_pockets_2,test:sunr,test:t2_c,test:t3_r,test:t3_t,test:tidepool_c,test:tidewrought_b,test:tidewrought_harp,test:tidewrought_leviathan_i,test:tidewrought_r,test:tidewrought_u,test:verdant_m,test:verdant_o,test:wid,test:world_so,test:wr"
  SHARD_8: "test:every_e,test:every_f,test:every_m,test:every_s,test:every_t,test:every_u,test:exi,test:ext,test:faction_aura_r,test:faction_l,test:fie,test:firs,test:fl,test:fo,test:fr,test:game_ender_a,test:gar,test:geo,test:go,test:gr,test:hd,test:hea,test:hero_a,test:hero_d,test:hero_gains_c,test:hero_ro,test:hero_s,test:hi,test:hold,test:holy_bell_reveals_t,test:hom,test:hor,test:hos,test:i,test:j,test:k,test:l,test:mac,test:mae,test:mag,test:man,test:map_c,test:map_d,test:match_h,test:melee_d,test:mer,test:mi,test:mo,test:n,test:o,test:pa,test:ph,test:pl,test:po,test:pre,test:production_buildings_place_every_unit_2,test:production_buildings_place_every_unit_4,test:production_q,test:production_r,test:q,test:rai,test:rea,test:rep,test:resign_v,test:ret,test:ro,test:ru,test:sa,test:se,test:sf,test:sh,test:si,test:sk,test:sm,test:sn,test:so,test:spa"
  # Oct 22 (tier gate): the bot T2 skirmish plays up to 15 game-minutes alone - a runner of its own, not the long pole of shard 1 or 6
  SHARD_9: "test:bots_reach_tier_2"
jobs:
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Design sheets preflight (unverified cells allowed for dev builds)
        run: python3 tools/preflight.py --allow-unverified
      - name: Generated code matches the sheets
        run: python3 tools/gen_java.py && git diff --exit-code engine/src/main/java/dev/beyondtabs/engine/gen
      - name: Safety protocol - structural syntax gate and balance audit
        run: |
          python3 tools/check_java.py $(git ls-files 'bar/src/main/java/*.java' 'mod/src/main/java/*.java' 'engine/src/*.java')
          python3 tools/check_guards.py
          python3 tools/check_server_client_imports.py
          python3 tools/balance_audit.py
          python3 tools/check_building_icons.py
          python3 tools/check_sail_hubs.py
          python3 tools/check_parts.py
          python3 tools/hud_layout.py
          python3 tools/ladder_report.py --selftest   # the nightly bot ladder's table (bot-ladder.yml)
          for f in design/anims/*.json; do python3 tools/anim_lab.py "$f" --check --motion; done   # animation lab: generated keys == data, no snaps / broken joints
      - name: Dependency pins in bar/build.gradle are lovish's files (Modrinth - only CI runners reach it)
        run: python3 tools/check_dep_pins.py
      - name: Engine benches (no Minecraft)
        run: |
          mkdir -p /tmp/bt && javac --release 17 -d /tmp/bt $(find engine/src -name "*.java")
          java -cp /tmp/bt dev.beyondtabs.engine.Bench
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8' }
      - name: Build the Forge mod
        run: |
          set -o pipefail
          gradle -p mod build --stacktrace 2>&1 | tee build.log || {
            # surface compiler errors as annotations (readable through the GitHub API)
            grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^.*/(mod|engine)/(src/[^:]+):([0-9]+): error: (.*)$#\1/\2#')
              l=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): error: .*$#\1#')
              m=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
              echo "::error file=$f,line=$l::$m"
            done
            grep -E "^\s+(symbol|location):" build.log | head -40 | sed 's/^/::warning::/'
            grep -E "FAILURE|What went wrong|> " build.log | head -20 | sed 's/^/::warning::/'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beyondandtabs-mod
          path: mod/build/libs/*.jar
      - name: Remove the previous dev build and older run artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          # only artifacts older than 2 h: a newer push must not delete the bar-mod jar a still-running build's
          # bar-publish job (and its eyes tour) is about to download (bar-mod is kept 3 days anyway)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${{ github.run_id }} and ((.created_at | fromdateiso8601) < (now - 7200))) | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
      - name: Publish the latest dev build (pre-release 'dev')
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest dev build
          prerelease: true
          make_latest: false
          body: "Automatic build of the newest commit on main (${{ github.sha }}). Untested in-game unless noted in the commit."
          files: mod/build/libs/*.jar

  # What this run needs to test (tools/ci_plan.py): `code` = anything outside docs changed, so the GameTests (jobs bar and
  # bar-tests) run; a docs-only change skips them (skipped counts as passing for ci_wait; nothing new to publish). The
  # fast `build` checks always run. `matrix` = the shard numbers from the SHARD_n lines above. Unsure -> code.
  # Ruff on the Python tools (bug-finding rules only, ruff.toml): seconds, so a script bug never costs a build.
  # On a PR it only does work when tools/ or ruff.toml changed; pushes to main always lint.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: scope
        name: Did tools/ or ruff.toml change?
        env: { EVENT: "${{ github.event_name }}", BASE: "${{ github.event.pull_request.base.sha }}", HEAD: "${{ github.event.pull_request.head.sha }}" }
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && git diff --quiet "$BASE...$HEAD" -- tools ruff.toml; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: pip install -q ruff==0.16.9 numpy pillow && ruff check tools && python3 -m unittest discover -s tools -p 'test_*.py'

  changes:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      code: ${{ steps.plan.outputs.code }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      where: ${{ steps.route.outputs.where }}
      devtime: ${{ steps.devtime.outputs.json }}
    steps:
      # the whole history, but treeless (commits only, no files of old commits): the dev-time count needs every commit's
      # time and nothing else. Counted ONCE here for bar and every shard - each of those 8 jobs used to fetch the whole
      # history itself (30-150 s apiece, Oct 22 run 39724663223) and now checks out one commit.
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools, fetch-depth: 0, filter: 'tree:0' }
      - id: devtime
        name: Count the development time (title screen, hud/DevTime)
        run: |
          # commits under 30 min apart count their real gap; each session gets 15 min before its first commit
          # (claude/dev-time-counter.md). Baked into the jar; nothing is computed at runtime.
          json=$(git log --format=%ct | sort -n | python3 -c "
          import sys, json
          t = [int(x) for x in sys.stdin if x.strip()]
          s = sum(b - a if b - a <= 1800 else 900 for a, b in zip(t, t[1:])) + 900 if t else 0
          print(json.dumps({'hours': round(s / 3600, 1), 'commits': len(t), 'since': t[0] if t else 0}))
          ")
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "::notice::[DevTime] $json"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_plan.py
      # 40 runners (lovish Oct 22): this account's 20 and the org mirror's 20 - PR GameTests go where fewer wait
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 tools/ci_route.py

  # the GameTests of a PR routed to the mirror (tools/ci_route.py): mark its head commit `ci-mirror` = "Queued for the
  # mirror". The org repo ILovishThe/beyond-and-tabs-ci (mirror-tests.yml) picks it up within ~5 min, reads the code
  # from this PUBLIC repo (no secrets anywhere) and runs the GameTests on its own 20 runners; ci-mirror-report.yml
  # sets the status to the result, which ci_wait / merge_pr read.
  mirror:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.changes.outputs.where == 'mirror' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=ci-mirror \
            -f description="Queued for the mirror" -f target_url="https://github.com/ILovishThe/beyond-and-tabs-ci/actions" >/dev/null
          echo "::notice::[Mirror] GameTests queued for the org runners (ILovishThe/beyond-and-tabs-ci)"

  # Beyond and Tabs on the Reign of Nether base (bar/): built with its own Gradle wrapper (ForgeGradle 5, Gradle 7.6)
  bar:
    # no `needs: build` any more (it put the 1.5 min of the tools audits on the critical path): bar-publish waits for
    # build, so the two releases are still never updated at the same moment. Docs-only changes skip this job.
    needs: changes
    # where=mirror: this PR's GameTests run on the org's runners instead (job mirror below, tools/ci_route.py)
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.where != 'mirror' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4   # one commit: the dev-time count comes from job changes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's caches (Forge, Minecraft, the deobfuscated jars ForgeGradle makes): restored instead of rebuilt by
          # every job of every build. Keyed on the build files, so a dependency change starts a fresh cache.
          cache: gradle
          cache-dependency-path: |
            bar/*.gradle
            bar/gradle.properties
            bar/gradle/wrapper/gradle-wrapper.properties
      - name: The development time (counted once, in job changes)
        env: { DEVTIME: "${{ needs.changes.outputs.devtime }}" }
        run: |
          [ -n "$DEVTIME" ] || DEVTIME='{"hours": 0, "commits": 0, "since": 0}'
          printf '%s' "$DEVTIME" > bar/src/main/resources/assets/reignofnether/devtime.json
      # mesh bodies (inbox/spec-1-mesh-bodies-2026-10-17.md): the .bmesh files are arithmetic on the design files, written
      # here, not kept in git - the jar carries them and MeshBodyTest (gradle test, below) checks the Paladin's draws
      # exactly like its cube model. Only this job's jar ships (bar-tests builds for its server tests, which never load one)
      - name: Mesh bodies (tools/mesh_export.py)
        run: |
          python3 -m pip install --quiet --user --break-system-packages numpy pillow >/dev/null 2>&1 || pip install --quiet numpy pillow
          python3 tools/mesh_export.py --from-dsl design/models/sunforged_paladin_radiant_winged.json
      - name: Build the BAR-on-RoN mod
        working-directory: bar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log || {
            grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^.*/bar/(src/[^:]+):([0-9]+): error: (.*)$#bar/\1#')
              l=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): error: .*$#\1#')
              m=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
              echo "::error file=$f,line=$l::$m"
            done
            grep -E "^\s+(symbol|location):" build.log | head -40 | sed 's/^/::warning::/'
            grep -E "FAILURE|What went wrong|> " build.log | head -20 | sed 's/^/::warning::/'
            exit 1
          }
      # the animation cost bench (bar/src/test/.../perf/AnimationCostBench, a JUnit test the build above ran): ~500
      # units' posing and drawing per frame, on the real model classes without a window - a measurement, as notices
      - name: Animation cost bench (measurement only)
        if: always()
        # the living army's wall-clock gates (motion-bench, motion-pass-bench, death-fall-bench) too: their margin to the budget was
        # never visible until one failed on #146 (Oct 27), so drift now shows in every build before it trips a gate
        run: |
          for f in anim-bench motion-bench motion-pass-bench death-fall-bench; do
            [ ! -f "bar/build/$f.txt" ] || while IFS= read -r line; do echo "::notice::$line"; done < "bar/build/$f.txt"
          done
      # the fast JUnit suite (bar/src/test, plan 008) ran inside the build above: one notice with the count, so a green
      # build proves the tests really executed (readable from the check-run annotations when job logs are not)
      - name: JUnit summary (count and time, as a notice)
        if: always()
        run: python3 tools/junit_summary.py bar/build/test-results/test
      - name: Keep this run's own jar (the eyes run tests exactly this build, not whatever bar-dev holds by then)
        uses: actions/upload-artifact@v4
        with:
          name: bar-mod
          path: bar/build/libs/*.jar
          retention-days: 3
      - name: Headless smoke tests on a real server, shard 1 of ${{ needs.changes.outputs.shards }} (everything the SHARD_n lists do not name)
        working-directory: bar
        run: |
          # shard 1 skips every other shard's list (all SHARD_n variables of the env block above)
          export BAT_GAMETEST_SKIP="$(env | grep -E '^SHARD_[0-9]+=' | cut -d= -f2- | paste -sd, -)"
          bash ../tools/ci_gametests.sh
      # every block id + blockstate of the building-block mods (gametest building_block_ids_dump_to_json, shard 1 - no
      # SHARD_n list names it) -> branch `block-ids` (data only), so building rounds can use them without lovish's PC
      # or a game boot. tools/block_ids.py refuses an empty or inconsistent dump, so a bad run never replaces a good one.
      - name: Publish the building-block id dump (branch block-ids)
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 tools/block_ids.py bar/run-gametest/block_ids
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/ids" && mkdir -p "$RUNNER_TEMP/ids"
            ( cd "$RUNNER_TEMP/ids"
              git init -q -b block-ids
              git config user.name "block-ids-bot"
              git config user.email "block-ids-bot@users.noreply.github.com"
              if git fetch -q --depth=1 "$url" block-ids 2>/dev/null; then git checkout -q -B block-ids FETCH_HEAD; fi
              git rm -q -r --ignore-unmatch . >/dev/null
              cp "$GITHUB_WORKSPACE"/bar/run-gametest/block_ids/*.json .
              printf '%s\n' "Building-block mod ids and blockstates (CI job bar, tools/block_ids.py schema)." \
                "Source commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}), run ${GITHUB_RUN_ID}. Data only - no mod assets." > README.md
              git add -A
              git diff --cached --quiet && { echo "block-ids unchanged"; exit 0; }
              git commit -q -m "Block ids from ${GITHUB_SHA::7}"
              git push -q "$url" block-ids ) && break
            [ "$attempt" = 4 ] && { echo "::warning::[Block ids] not pushed after 4 tries"; break; }
            sleep $((attempt * 5))
          done
      # the duel simulator (gametest/DuelGameTests) is a balance measurement: its results become a handful of notices
      # (readable through the GitHub API), and this step never fails the build - only the test itself can, on a duel
      # that could not run
      - name: Duel simulator results (measurement only)
        if: always()
        run: |   # only in the shard that ran the duel simulator (no false "no duel results" warning elsewhere)
          [ ! -f bar/run-gametest/duel_results.json ] || python3 tools/duel_summary.py bar/run-gametest/duel_results.json || true
      - name: Keep this shard's test list (bar-audit proves every test ran once; per-test wall times for re-balancing)
        if: always()
        run: |
          grep -hE "\[TestTime\]|\[Shards\]" bar/gametest.log > shard-report.txt || true
          [ ! -f bar/gametest.log ] || python3 tools/gametest_audit.py --times bar/gametest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametests-shard-1-a${{ github.run_attempt }}   # per attempt: a rerun must not lose to the old report
          path: shard-report.txt
          retention-days: 3
          if-no-files-found: warn

  # shards 2..N of the headless tests, side by side with bar's shard 1 (gametest/GameTestShards): the suite ran its
  # batches one after another for 16-29 minutes of a build (Oct 15, the [GameTest timing] notice); split, the longest
  # shard sets the time. One matrix entry per SHARD_n line of the env block. Same checkout, dev-time count and script
  # as bar; no jar is kept from here. Docs-only changes skip it.
  bar-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.changes.outputs.where != 'mirror' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false   # each shard reports its own failures
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4   # one commit: the dev-time count (the DevTime tests read it) comes from job changes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's caches (Forge, Minecraft, the deobfuscated jars ForgeGradle makes): restored instead of rebuilt by
          # every job of every build. Keyed on the build files, so a dependency change starts a fresh cache.
          cache: gradle
          cache-dependency-path: |
            bar/*.gradle
            bar/gradle.properties
            bar/gradle/wrapper/gradle-wrapper.properties
      - name: The development time (counted once, in job changes)
        env: { DEVTIME: "${{ needs.changes.outputs.devtime }}" }
        run: |
          [ -n "$DEVTIME" ] || DEVTIME='{"hours": 0, "commits": 0, "since": 0}'
          printf '%s' "$DEVTIME" > bar/src/main/resources/assets/reignofnether/devtime.json
      - name: Headless smoke tests on a real server, shard ${{ matrix.shard }} of ${{ needs.changes.outputs.shards }}
        working-directory: bar
        env: { BAT_GAMETEST_ONLY: "${{ env[format('SHARD_{0}', matrix.shard)] }}" }
        run: |
          chmod +x gradlew
          bash ../tools/ci_gametests.sh
      - name: Duel simulator results (measurement only)
        if: always()
        run: |   # only in the shard that ran the duel simulator (no false "no duel results" warning elsewhere)
          [ ! -f bar/run-gametest/duel_results.json ] || python3 tools/duel_summary.py bar/run-gametest/duel_results.json || true
      - name: Keep this shard's test list (bar-audit proves every test ran once; per-test wall times for re-balancing)
        if: always()
        run: |
          grep -hE "\[TestTime\]|\[Shards\]" bar/gametest.log > shard-report.txt || true
          [ ! -f bar/gametest.log ] || python3 tools/gametest_audit.py --times bar/gametest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametests-shard-${{ matrix.shard }}-a${{ github.run_attempt }}   # per attempt (gametest_audit keeps the newest)
          path: shard-report.txt
          retention-days: 3
          if-no-files-found: warn

  # every test ran exactly once: the shards' test lists, side by side (tools/gametest_audit.py). Cheap (seconds).
  bar-audit:
    needs: [bar, bar-tests]
    if: ${{ !cancelled() && needs.bar.result == 'success' && needs.bar-tests.result == 'success' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools, fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with: { pattern: gametests-shard-*, path: shard-reports }
      - run: python3 tools/gametest_audit.py shard-reports

  # publishes bar-dev only when every test shard passed (bar's jar, kept as the run's artifact bar-mod). Never on a
  # docs-only change (bar and bar-tests are skipped: nothing new to publish).
  bar-publish:
    needs: [build, bar, bar-tests, bar-audit]
    # explicit: bar + every shard + the audit passed. The implicit success() would also wait on the `build` job (tools
    # audits, mod/), which never gated bar-dev before the split - it is in needs only so the two releases are never
    # updated at the same moment
    if: ${{ !cancelled() && needs.bar.result == 'success' && needs.bar-tests.result == 'success' && needs.bar-audit.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bar-mod, path: bar/build/libs }
      - name: Our realistic block pack as a zip (tools/gen_blocks.py - the textures are generated, not stored in git)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user --break-system-packages numpy pillow >/dev/null 2>&1 || pip install --quiet numpy pillow
          python3 tools/gen_blocks.py > /dev/null
          mkdir -p dist
          (cd resourcepacks/BeyondAndTabs-Realistic && zip -q -r -X ../../dist/BeyondAndTabs-Realistic.zip pack.mcmeta README.md assets)
          n=$(unzip -l dist/BeyondAndTabs-Realistic.zip | grep -c '\.png$')
          echo "::notice::[Pack] BeyondAndTabs-Realistic.zip: $n textures, $(du -k dist/BeyondAndTabs-Realistic.zip | cut -f1) KB"
          [ "$n" -ge 30 ] || { echo "::error::the block pack zip has only $n textures"; exit 1; }
      - name: Remove the previous BAR build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete bar-dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
      - name: Publish the latest BAR build (pre-release 'bar-dev')
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bar-dev
          name: Latest BAR build (Reign of Nether base)
          prerelease: true
          make_latest: false
          body: "Automatic build of bar/ at ${{ github.sha }}. Untested in-game unless noted in the commit."
          files: |
            bar/build/libs/*.jar
            dist/BeyondAndTabs-Realistic.zip
