name: build
on:
  # Runners (lovish Oct 21 02:16: "run multiple runners"): pull-request builds run on GitHub's own runners (free for
  # this public repo, many at once); pushes to main and manual runs stay on vars.RUNNER (the self-hosted pc-1), so
  # bar-dev is still published from the same machine. Before, every build queued on pc-1 alone.
  # push only on main: a PR branch builds once through pull_request (with one self-hosted runner, pc-1, the extra
  # push run doubled the queue - Oct 18). Other branches can still be built by hand with workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # pull requests: a newer push to a PR replaces that PR's older queued or running build.
  # main pushes share ONE group without cancel-in-progress (lovish Oct 21): at most one main build runs and ONE waits;
  # a newer merge replaces the waiting one (GitHub cancels an older *pending* run of a group), the running one is never
  # cut off - so a batch of quick merges costs two builds, not one per merge.
  # manual runs get a group of their own, so they never cancel each other.
  group: build2-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && 'main-push' || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
  actions: write
env:
  # The headless GameTests run in 9 shards side by side (gametest/GameTestShards); the public repo gets ~20 hosted
  # runners shared by every build and flake-stress. Job `bar` is shard 1 and runs everything no list names (so a new
  # test or batch lands there); job `bar-tests` runs one matrix entry per SHARD_n below, n >= 2 (the `changes` job builds
  # the matrix from these lines). An entry names a whole batch ("duel_matrix") or tests by a prefix of the lower-cased
  # METHOD name ("test:bots_pl"). No test may be named by two lists: bar-audit proves every test ran exactly once.
  # THE SHARD_n LINES ARE GENERATED - do not hand-place tests: `python3 tools/shard_plan.py write` re-plans them from
  # measured times (tools/shard_times.json; `shard_plan.py refresh <green PR run ids>` re-measures). A server runs its
  # batches one after another and a batch costs its arenas' placement (~1.1 s a test) plus its slowest test, so the plan
  # keeps every named batch whole, prices each default-batch test by the vanilla chunk it falls in (Forge's HashSet
  # order, replayed from the sources), spreads each chunk's heavy tests (>= 90 s: production, raid parties, sieges, the
  # bot skirmishes - they slow each other in one batch) and balances the shards by predicted job time, shard 1 carrying
  # the jar build too. tools/test_shard_plan.py fails when the slowest shard is predicted past 1.5x the mean, a named
  # batch is split or a test is named twice. A test's arena sits beside its batch neighbours', so a new mix can put
  # another test's units within its reach: a test that goes red only in a new mix is a neighbour bug in that test -
  # report and fix it, never retry it or move it out of the way.
