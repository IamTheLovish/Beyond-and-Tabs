name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Design sheets preflight (unverified cells allowed for dev builds)
        run: python3 tools/preflight.py --allow-unverified
      - name: Generated code matches the sheets
        run: python3 tools/gen_java.py && git diff --exit-code engine/src/main/java/dev/beyondtabs/engine/gen
      - name: Safety protocol - structural syntax gate and balance audit
        run: |
          python3 tools/check_java.py $(git ls-files 'bar/src/main/java/*.java' 'mod/src/main/java/*.java' 'engine/src/*.java')
          python3 tools/balance_audit.py
          python3 tools/check_building_icons.py
          python3 tools/check_sail_hubs.py
          python3 tools/hud_layout.py
      - name: Engine benches (no Minecraft)
        run: |
          mkdir -p /tmp/bt && javac --release 17 -d /tmp/bt $(find engine/src -name "*.java")
          java -cp /tmp/bt dev.beyondtabs.engine.Bench
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8' }
      - name: Build the Forge mod
        run: |
          set -o pipefail
          gradle -p mod build --stacktrace 2>&1 | tee build.log || {
            # surface compiler errors as annotations (readable through the GitHub API)
            grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^.*/(mod|engine)/(src/[^:]+):([0-9]+): error: (.*)$#\1/\2#')
              l=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): error: .*$#\1#')
              m=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
              echo "::error file=$f,line=$l::$m"
            done
            grep -E "^\s+(symbol|location):" build.log | head -40 | sed 's/^/::warning::/'
            grep -E "FAILURE|What went wrong|> " build.log | head -20 | sed 's/^/::warning::/'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beyondandtabs-mod
          path: mod/build/libs/*.jar
      - name: Remove the previous dev build and older run artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
      - name: Publish the latest dev build (pre-release 'dev')
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest dev build
          prerelease: true
          make_latest: false
          body: "Automatic build of the newest commit on main (${{ github.sha }}). Untested in-game unless noted in the commit."
          files: mod/build/libs/*.jar

  # Beyond and Tabs on the Reign of Nether base (bar/): built with its own Gradle wrapper (ForgeGradle 5, Gradle 7.6)
  bar:
    needs: build   # publish after the main job so the two releases are never updated at the same moment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the whole history, for the dev-time count below
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Count the development time (title screen, hud/DevTime)
        run: |
          # commits under 30 min apart count their real gap; each session gets 15 min before its first commit
          # (claude/dev-time-counter.md). Baked into the jar; nothing is computed at runtime.
          git log --format=%ct | sort -n | python3 -c "
          import sys, json
          t = [int(x) for x in sys.stdin if x.strip()]
          s = sum(b - a if b - a <= 1800 else 900 for a, b in zip(t, t[1:])) + 900 if t else 0
          json.dump({'hours': round(s / 3600, 1), 'commits': len(t), 'since': t[0] if t else 0},
                    open('bar/src/main/resources/assets/reignofnether/devtime.json', 'w'))
          print('dev time:', round(s / 3600, 1), 'h over', len(t), 'commits')
          "
          echo "::notice::[DevTime] $(cat bar/src/main/resources/assets/reignofnether/devtime.json)"
      - name: Build the BAR-on-RoN mod
        working-directory: bar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log || {
            grep -E "\.java:[0-9]+: error:" build.log | head -40 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^.*/bar/(src/[^:]+):([0-9]+): error: (.*)$#bar/\1#')
              l=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): error: .*$#\1#')
              m=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
              echo "::error file=$f,line=$l::$m"
            done
            grep -E "^\s+(symbol|location):" build.log | head -40 | sed 's/^/::warning::/'
            grep -E "FAILURE|What went wrong|> " build.log | head -20 | sed 's/^/::warning::/'
            exit 1
          }
      - name: Headless smoke tests on a real server (gametest/SkirmishGameTests)
        working-directory: bar
        run: |
          set -o pipefail
          # a watchdog: a hung server (a deadlock at shutdown, a test that never settles) used to hold the job for the
          # runner's 6 h limit with nothing readable; now it stops at 40 min and the log's tail becomes a notice (32 min
          # was too tight once the suite passed ~25 holders on a slow runner)
          # stall watcher: when the server log goes quiet for 150 s (a hang, a deadlock, a tick that never ends), take up
          # to 3 thread dumps of the game-test JVM so the "Server thread" stack can be reported below - a watchdog kill
          # alone says nothing about where it was stuck
          ( n=0; while sleep 30; do
              [ -f gametest.log ] || continue
              age=$(( $(date +%s) - $(stat -c %Y gametest.log) ))
              if [ "$age" -ge 150 ] && [ "$n" -lt 3 ]; then
                for pid in $(jps -l | grep -v -E "Gradle|Jps|Worker" | awk '{print $1}'); do
                  jcmd "$pid" Thread.print > "stall_${n}_${pid}.txt" 2>/dev/null || true
                done
                n=$((n+1)); sleep 120
              fi
            done ) &
          WATCHER=$!
          timeout 40m ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log | grep -E "GameTest|gametest|FAIL|fail|Exception|Error|error" || true
          kill $WATCHER 2>/dev/null || true
          # the server thread's stack from each stall dump, one notice each (%0A = newline)
          for f in stall_*.txt; do
            [ -f "$f" ] || continue
            awk '/^"Server thread"/{p=1} p&&/^$/{exit} p' "$f" | head -45 | cut -c1-220 | sed 's/%/%25/g' | awk -v f="$f" 'BEGIN{printf "::notice::[Stall dump " f "]"} {printf "%%0A%s", $0} END{print ""}' || true
          done
          # the worldgen / IO workers of the last dump (the server thread often waits on them): every non-idle
          # Worker-Main / IO-Worker stack, cut short, in one notice
          last=$(ls stall_*.txt 2>/dev/null | tail -1 || true)
          if [ -n "$last" ]; then
            awk 'function flush(){ if (keep) { for (i = 1; i <= n; i++) print L[i]; print "----" } n = 0; keep = 0 }
                 /^"/ { flush(); p = ($0 ~ /^"(Worker-Main|IO-Worker|Util|ForkJoin)/) }
                 p && NF { L[++n] = $0; if ($0 ~ /reignofnether|BLOCKED|waiting to lock/) keep = 1 }
                 END { flush() }' "$last" | head -150 | cut -c1-200 | sed 's/%/%25/g' | awk 'BEGIN{printf "::notice::[Stall workers]"} {printf "%%0A%s", $0} END{print ""}' || true
          fi
          # the 8v8 stress benchmark's per-system timings, as notices readable through the GitHub API
          grep -oE "\[Stress\].*" gametest.log | head -5 | sed 's/^/::notice::/' || true
          # the melee diagnostics (gametest/DuelGameTests): one line per fight, folded into ONE notice (%0A = newline)
          # because a step only keeps the first 10 notices
          grep -oE "\[Melee\].*" gametest.log | head -40 | sed 's/%/%25/g' | awk 'BEGIN{printf "::notice::[Melee diagnostics]"} {printf "%%0A%s", $0} END{print ""}' || true
          # the bot soak (gametest/SkirmishGameTests bots_play_each_other_without_errors): one line per bot, one notice
          grep -oE "\[Soak\].*" gametest.log | head -8 | sed 's/%/%25/g' | awk 'BEGIN{printf "::notice::[Bot soak]"} {printf "%%0A%s", $0} END{print ""}' || true
          if ! grep -qE "All [0-9]+ required tests passed" gametest.log; then
            # the test verdicts first ("<name> failed!", timeouts, the summary), then exceptions; chunk-load warnings
            # ("Tried to load a block entity ... failed") used to fill all 30 slots and hide the real failure
            # (each grep may find nothing - after a watchdog kill there is no "failed!" line - so every pipeline ends in
            # `|| true`: under bash -e and pipefail an empty grep used to end the step before the log tail below)
            { grep -E "failed!|timed out|required tests failed|Test .* failed" gametest.log | head -20 || true;
              grep -E "Exception|FAILED" gametest.log | grep -v "Tried to load a block entity\|server.properties\|rethrowAs\|translateTo" | head -10 || true; } | sed 's/^/::error::/' || true
            # the last lines the server wrote, folded into one notice (%0A = newline): shows a hang or a crash
            grep -v "Tried to load a block entity" gametest.log | tail -40 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{printf "::notice::[Log tail]"} {printf "%%0A%s", $0} END{print ""}' || true
            echo "::error::game tests did not report success"; exit 1
          fi
      # the duel simulator (gametest/DuelGameTests) is a balance measurement: its results become a handful of notices
      # (readable through the GitHub API), and this step never fails the build - only the test itself can, on a duel
      # that could not run
      - name: Duel simulator results (measurement only)
        if: always()
        run: python3 tools/duel_summary.py bar/run-gametest/duel_results.json || true
      - name: Remove the previous BAR build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete bar-dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
      - name: Publish the latest BAR build (pre-release 'bar-dev')
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bar-dev
          name: Latest BAR build (Reign of Nether base)
          prerelease: true
          make_latest: false
          body: "Automatic build of bar/ at ${{ github.sha }}. Untested in-game unless noted in the commit."
          files: bar/build/libs/*.jar
