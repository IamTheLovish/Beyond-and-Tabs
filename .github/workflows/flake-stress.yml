name: flake-stress
# the tested ref in the run's title: a run is evidence for the branch it tested, and the Command Center gate finds a
# branch's runs by it (every run was titled "flake-stress" whatever it tested)
run-name: "flake-stress ${{ inputs.ref }}"
# Runs a few chosen GameTests on many runners at once and adds up how often each one fails - so a flaky test gets a
# real fail rate instead of "it failed once on #55", and a flake fix can be proven (0 of N) rather than hoped for.
# Costs no Claude usage: public-repo runner minutes only. Manual only (never on push).
#   gh workflow run flake-stress.yml -f ref=<branch> -f tests="test:six_melee,test:stuck_chaser" -f runners=8
# Each runner compiles bar/ and runs only BAT_GAMETEST_ONLY (gametest/GameTestShards: batch names or test:<prefix>).
# A flake that only shows inside a full shard (its neighbours' units, the shard's load and arena layout) is repeated as
# that whole shard: `-f shard=1 -f focus=tidewrought_t2` runs shard 1 (everything no SHARD_n line names) on every runner,
# exactly as build.yml cuts it from the SHARD_n lines of the checked-out ref, and the summary then lists only the tests
# `focus` names (prefixes, comma-separated) plus every failure. With `shard` set, `tests` is ignored.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test (default main)
        default: main
      tests:
        description: BAT_GAMETEST_ONLY list - batch names or test:<prefix>, comma-separated
        default: "test:bots_play_each_other_without_errors,test:mirror_images_decoys_draw_fire,test:six_melee_attackers_ring_their_target,test:stuck_chaser_is_nudged_then_drops_its_target,test:shift_move_after_an_attack_waits_for_the_kill"
      runners:
        description: Parallel runners (1-10); each run of each test is one sample
        default: "6"
      shard:
        description: Optional - repeat a whole CI shard (2-9, or 1 = everything the other SHARD_n lines do not name) instead of `tests`
        default: ""
      focus:
        description: Optional, with `shard` - test-name prefixes (comma-separated, test:<prefix> also accepted) whose passes the summary lists; failures are always listed, and a `tests` run lists every test
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      # a `tests` entry that is neither a batch nor test:<prefix> runs 0 tests (Oct 27: four runs given bare test names):
      # refuse it before any runner starts. The check from this workflow's own commit, the batch names from the ref
      # under test (an older ref has no copy of the tool)
      - uses: actions/checkout@v4
        if: inputs.shard == ''
        with:
          path: wf
          sparse-checkout: tools/ci_stress_check.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        if: inputs.shard == ''
        with:
          ref: "${{ inputs.ref }}"
          path: tested
          sparse-checkout: bar/src/main/java/com/solegendary/reignofnether/gametest
      - name: The tests list names batches or test:<prefix>
        if: inputs.shard == ''
        env: { ST_ONLY: "${{ inputs.tests }}" }
        run: python3 wf/tools/ci_stress_check.py entries "$ST_ONLY" tested/bar/src/main/java/com/solegendary/reignofnether/gametest
      - id: m
        run: |
          n="${{ inputs.runners }}"
          case "$n" in ''|*[!0-9]*) n=6;; esac
          [ "$n" -lt 1 ] && n=1; [ "$n" -gt 10 ] && n=10
          echo "matrix=$(python3 -c "import json; print(json.dumps(list(range(1, $n + 1))))")" >> "$GITHUB_OUTPUT"

  stress:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # the same Gradle cache as build.yml's test jobs: ten samples starting at once otherwise download Minecraft's
          # assets ten times over (the Oct 22 "downloadAssets ... Read timed out" reds)
          cache: gradle
          cache-dependency-path: |
            bar/*.gradle
            bar/gradle.properties
            bar/gradle/wrapper/gradle-wrapper.properties
      - name: The chosen tests, sample ${{ matrix.run }}
        id: t
        working-directory: bar
        env:
          ST_ONLY: ${{ inputs.tests }}
          ST_SHARD: ${{ inputs.shard }}
        continue-on-error: true
        run: |
          chmod +x gradlew
          if [ -n "$ST_SHARD" ]; then
            # a whole CI shard, cut from build.yml's SHARD_n lines (tools/ci_shard_env.py)
            eval "$(python3 ../tools/ci_shard_env.py "$ST_SHARD")"
          else
            export BAT_GAMETEST_ONLY="$ST_ONLY"
          fi
          bash ../tools/ci_gametests.sh
      - name: Record which tests ran and which failed
        if: always()
        run: |
          python3 - <<'EOF'
          import json, re, os
          log = open("bar/gametest.log", errors="replace").read() if os.path.exists("bar/gametest.log") else ""
          failed = sorted(set(re.findall(r"\b([a-z0-9_]+) failed!", log)))
          # passes: vanilla's reporter says nothing on a pass; GameTestShards logs "[TestTime] <name> <ms>" for each
          names = re.findall(r"\[TestTime\]\s+(?:[A-Za-z0-9_]+\.)?([a-z0-9_]+)", log)
          passed = sorted(set(names) - set(failed))
          # how many tests this sample really ran: a `tests` entry without `test:` (a bare method name is read as a
          # batch name and matches nothing) ran 0 and the gametest server still says "All 0 required tests passed" -
          # four samples on Oct 27 were posted as "[Stress] 0 failures" that way. The summary fails such a sample.
          ran = len(set(passed) | set(failed))
          out = {"run": ${{ matrix.run }}, "failed": failed, "passed": passed, "ran": ran,
                 "outcome": "${{ steps.t.outcome }}", "log_found": bool(log)}
          json.dump(out, open("stress-${{ matrix.run }}.json", "w"))
          print(out)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.run }}
          path: stress-${{ matrix.run }}.json
          retention-days: 7

  summary:
    needs: stress
    if: always()
    runs-on: ubuntu-latest
    steps:
      # the summary is tools/flake_stress_summary.py (tested by tools/test_flake_stress_summary.py): a sample that ran
      # no test, or a `test:` prefix that matched nothing, makes this job red with an error annotation
      # the workflow's own commit, not inputs.ref: stressing an older branch that predates the tool still works
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/flake_stress_summary.py
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
        with: { pattern: "stress-*", merge-multiple: true, path: samples }
      - name: Fail rate per test
        env:
          ST_FOCUS: "${{ inputs.focus }}"
          ST_ONLY: "${{ inputs.tests }}"
          ST_SHARD: "${{ inputs.shard }}"
        run: python3 src/tools/flake_stress_summary.py samples
